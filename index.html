<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario Bisutería</title>
<meta name="theme-color" content="#2b2326">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#faf6f3;--card:#fff;--ink:#2b2326;--mut:#7a6d71;--line:#eadfdb;--acc:#9c5b6a;--acc2:#f3e4e7;--gold:#b8901f;--ok:#2f7d4f;--okb:#e2f3e8;--warn:#a5641a;--warnb:#fbefdc;--bad:#b23a3a;--badb:#fbe5e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px 0}
header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
#sync{font-size:12px;opacity:.85;margin-top:2px}
nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav button{flex:1;background:none;border:0;color:#d9cdd0;padding:9px 6px 10px;font:inherit;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#e6b9c3;font-weight:600}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font:inherit;font-weight:550;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad);border-color:#efc9c9}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.full{width:100%}
.mut{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.thumb{width:58px;height:58px;border-radius:9px;object-fit:cover;background:var(--acc2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:11px;text-align:center;border:0;padding:0;cursor:pointer}
.thumb.nofoto{border:1.5px dashed #d9b3bc}
.name{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.sku{font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;color:var(--acc)}
.qty input{width:56px;text-align:center;padding:8px 2px;font-weight:650;font-size:16px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.p-pend{background:#eee;color:#555}.p-cur{background:var(--warnb);color:var(--warn)}.p-ok{background:var(--okb);color:var(--ok)}
.fab{position:fixed;right:16px;bottom:18px;z-index:6;border-radius:99px;padding:14px 20px;box-shadow:0 6px 18px rgba(80,30,45,.25)}
.modal{position:fixed;inset:0;background:rgba(30,20,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 20px}
.sheet h2{margin:0 0 6px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photo{width:100%;aspect-ratio:4/3;border-radius:12px;border:1.5px dashed #d9b3bc;background:var(--acc2);display:flex;align-items:center;justify-content:center;color:var(--acc);overflow:hidden;cursor:pointer;flex-direction:column;gap:4px;font-weight:600}
.photo img{width:100%;height:100%;object-fit:contain;background:#fff}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;display:none}
.warnbox{background:var(--warnb);color:#6b4310;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
.issue{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.issue:last-child{border:0}
h3{font-size:15px;margin:4px 0 8px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none!important}
#printRoot{display:none}
.codes{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.codes svg{width:100%;height:auto;display:block}
.codes .bc svg{height:56px}
@media print{
  @page{margin:8mm}
  body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:flex!important;flex-wrap:wrap;gap:2mm;font-family:Arial,sans-serif;color:#000}
  .lbl{border:0.2mm dashed #999;padding:2mm;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;gap:1mm;overflow:hidden}
  .sz-m .lbl{width:62mm;height:36mm}.sz-s .lbl{width:46mm;height:30mm}
  .sz-t .lbl{width:50mm;height:25mm;border:0;page-break-after:always;break-after:page;padding:1mm 1.5mm}
  .sz-t{gap:0!important}
  .lbl-n{font-size:7.5pt;font-weight:bold;line-height:1.1;max-height:2.2em;overflow:hidden}
  .lbl-p{font-size:10pt;font-weight:bold}
  .lbl-c{display:flex;gap:1.5mm;align-items:center;flex:1;min-height:0}
  .lbl-b{flex:1;min-width:0}.lbl-b svg{width:100%;height:9mm;display:block}
  .sz-t .lbl-b svg{height:7mm}
  .lbl-q svg{height:15mm;width:15mm;display:block}.sz-t .lbl-q svg{height:12mm;width:12mm}.sz-s .lbl-q svg{height:12mm;width:12mm}
  .lbl-s{font:6.5pt monospace;text-align:center;letter-spacing:.3px}
}

		for (var i = 0; i < length; i++) {

	glog : function(n) {

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;

                         qrCode.isDark(row + 3, col) &&

function nextSeq(prefix){let mx=0;S.products.forEach(p=>{const s=String(p.sku||"");if(s.startsWith(prefix+"-")){const n=parseInt(s.split("-").pop(),10);if(n>mx)mx=n;}});return mx+1;}
function genSku(p,seq){const pre=catPrefix(p.cat);return [pre,abbr(p.material),abbr(p.color)].join("-")+"-"+String(seq||nextSeq(pre)).padStart(3,"0");}
function list(){return Array.from(S.products.values());}

/* ---------- Almacenamiento en el celular (IndexedDB) ---------- */
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("inv_bisuteria",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("emb"))d.createObjectStore("emb");if(!d.objectStoreNames.contains("productos"))d.createObjectStore("productos");if(!d.objectStoreNames.contains("zonas"))d.createObjectStore("zonas");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbAll(st){return new Promise((res,rej)=>{const out=new Map();const c=idb.transaction(st).objectStore(st).openCursor();c.onsuccess=()=>{const k=c.result;if(k){out.set(k.key,k.value);k.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
function idbPut(st,key,val){return new Promise((res,rej)=>{const t=idb.transaction(st,"readwrite");t.objectStore(st).put(val,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function idbDel(st,key){return new Promise((res,rej)=>{const t=idb.transaction(st,"readwrite");t.objectStore(st).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
function saveErr(e){toast((e&&e.name==="QuotaExceededError")?"Memoria del celular llena: libera espacio.":"No se pudo guardar en el celular.",4000);throw e;}
function writeProduct(id,data){S.products.set(id,data);updSync();return idbPut("productos",id,data).catch(saveErr);}
function delProduct(id){S.products.delete(id);updSync();return idbDel("productos",id).catch(saveErr);}
function writeZone(id,data){S.zones.set(id,data);return idbPut("zonas",id,data).catch(saveErr);}
function delZone(id){S.zones.delete(id);return idbDel("zonas",id).catch(saveErr);}
function bumpStock(id,newStock){
  const p=S.products.get(id);if(!p)return;
  const d=Object.assign({},p,{stock:Math.max(0,Math.round(newStock)),contado:true,actualizado:new Date().toISOString()});
  S.products.set(id,d);
  clearTimeout(pending.get(id));
  pending.set(id,setTimeout(()=>{pending.delete(id);writeProduct(id,S.products.get(id)).catch(()=>{});},400));
}
function setSync(t){$("#sync").textContent=t;}
function updSync(){setSync("● Guardado en este celular · "+S.products.size+" productos · "+(navigator.onLine?"en línea":"sin internet"));}

    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q||0.72));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;
  });
}

/* ---------- Reconocer tipo de pieza (aprende de las fotos del inventario) ---------- */
const AI={model:null,loading:null,emb:new Map(),failed:false};
function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement("script");t.src=src;t.onload=res;t.onerror=()=>rej(new Error(src));document.head.appendChild(t);});}
function aiLoad(){
  if(AI.model)return Promise.resolve(AI.model);
  if(AI.loading)return AI.loading;
  AI.loading=(async()=>{
    if(!window.tf)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
    if(!window.mobilenet)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");
    AI.model=await window.mobilenet.load({version:2,alpha:1.0});return AI.model;
  })().catch(e=>{AI.loading=null;AI.failed=true;throw e;});
  return AI.loading;
}
function imgFromData(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function aiEmbed(foto){
  const m=await aiLoad();const img=await imgFromData(foto);
  const t=m.infer(img,true);const v=Array.from(await t.data());t.dispose();
  let n=0;for(const x of v)n+=x*x;n=Math.sqrt(n)||1;return v.map(x=>x/n);
}
async function aiLearn(id,p){
  if(!p||!p.foto||!p.cat)return;
  try{const v=await aiEmbed(p.foto);const e={cat:p.cat,v,n:p.foto.length};AI.emb.set(id,e);await idbPut("emb",id,e);}catch(e){}
}
function aiForget(id){AI.emb.delete(id);idbDel("emb",id).catch(()=>{});}
function aiStats(){const c={};AI.emb.forEach((e,id)=>{const p=S.products.get(id);if(!p)return;c[p.cat]=(c[p.cat]||0)+1;});return c;}
async function aiGuess(foto,excludeId){
  const ex=[];AI.emb.forEach((e,id)=>{const p=S.products.get(id);if(p&&id!==excludeId)ex.push({cat:p.cat,v:e.v});});
  const cats=new Set(ex.map(x=>x.cat));
  if(ex.length<8||cats.size<2)return {need:true,have:ex.length};
  const v=await aiEmbed(foto);
  const sc=ex.map(x=>{let d=0;for(let i=0;i<v.length;i++)d+=v[i]*x.v[i];return {cat:x.cat,s:d};}).sort((a,b)=>b.s-a.s).slice(0,7);
  const w={};let tot=0;sc.forEach(x=>{const k=Math.max(0,x.s)**4;w[x.cat]=(w[x.cat]||0)+k;tot+=k;});
  const best=Object.entries(w).sort((a,b)=>b[1]-a[1])[0];
  return {cat:best[0],conf:tot?best[1]/tot:0};
}
async function aiTrainAll(btn){
  const todo=list().map(p=>[idOf(p),p]).filter(([id,p])=>p.foto&&(!AI.emb.has(id)||AI.emb.get(id).n!==p.foto.length));
  if(!todo.length)return toast("Todas las fotos ya están aprendidas");
  try{if(btn)btn.textContent="Cargando motor de reconocimiento…";await aiLoad();}catch(e){if(btn)btn.textContent="Aprender de las fotos";return toast("Se necesita internet la primera vez para descargar el reconocimiento.",4500);}
  for(let i=0;i<todo.length;i++){if(btn)btn.textContent="Aprendiendo "+(i+1)+" / "+todo.length+"…";await aiLearn(todo[i][0],todo[i][1]);}
  toast("Listo: "+todo.length+" fotos aprendidas");render();
}

/* ---------- Contar piezas en una foto (sobre fondo liso) ---------- */
function countPieces(img,sens){
  const MAX=640;const r=Math.min(1,MAX/Math.max(img.width,img.height));const W=Math.round(img.width*r),H=Math.round(img.height*r);
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.drawImage(img,0,0,W,H);
  const px=g.getImageData(0,0,W,H).data;
  // background color = median of a border band
  const br=[],bg=[],bb=[];const band=Math.max(3,Math.round(Math.min(W,H)*0.03));
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){if(x<band||y<band||x>=W-band||y>=H-band){const i=(y*W+x)*4;br.push(px[i]);bg.push(px[i+1]);bb.push(px[i+2]);}}
  const med=a=>{a.sort((x,y)=>x-y);return a[a.length>>1];};const R=med(br),G=med(bg),B=med(bb);
  // distance to background + Otsu threshold
  const d=new Float32Array(W*H);const hist=new Uint32Array(256);
  for(let i=0,j=0;i<d.length;i++,j+=4){const v=Math.min(255,Math.sqrt((px[j]-R)**2+(px[j+1]-G)**2+(px[j+2]-B)**2));d[i]=v;hist[v|0]++;}
  let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];let sB=0,wB=0,best=0,th=40;const N=d.length;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF;const v=wB*wF*(mB-mF)**2;if(v>best){best=v;th=t;}}
  th=Math.max(18,th*(1.25-0.1*sens)); // more sensitivity -> lower threshold
  let m=new Uint8Array(W*H);for(let i=0;i<N;i++)m[i]=d[i]>th?1:0;
  // close small gaps (chains, links) so one piece stays one blob
  const rad=Math.max(1,Math.round(Math.min(W,H)*0.004*(6-sens)));
  const dil=(a,rv)=>{const o=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!a[y*W+x])continue;for(let dy=-rv;dy<=rv;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;for(let dx=-rv;dx<=rv;dx++){const xx=x+dx;if(xx>=0&&xx<W)o[yy*W+xx]=1;}}}return o;};
  const ero=(a,rv)=>{const o=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let ok=1;for(let dy=-rv;dy<=rv&&ok;dy++){const yy=y+dy;if(yy<0||yy>=H){continue;}for(let dx=-rv;dx<=rv;dx++){const xx=x+dx;if(xx>=0&&xx<W&&!a[yy*W+xx]){ok=0;break;}}}o[y*W+x]=ok;}return o;};
  m=ero(dil(m,rad),rad);
  // connected components
  const lab=new Int32Array(W*H);const comps=[];const st=[];
  for(let i=0;i<N;i++){if(!m[i]||lab[i])continue;const id=comps.length+1;let a=0,x0=W,y0=H,x1=0,y1=0;st.push(i);lab[i]=id;
    while(st.length){const k=st.pop();a++;const x=k%W,y=(k/W)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      const nb=[k-1,k+1,k-W,k+W];for(const q of nb){if(q<0||q>=N||lab[q]||!m[q])continue;if((q===k-1&&x===0)||(q===k+1&&x===W-1))continue;lab[q]=id;st.push(q);}}
    comps.push({a,x0,y0,x1,y1});}
  const minA=N*0.0008*(6-sens);
  let keep=comps.filter(o=>o.a>=minA&&!(o.x1-o.x0>W*0.9&&o.y1-o.y0>H*0.9));
  // blobs much bigger than the typical piece are probably several touching pieces
  const areas=keep.map(o=>o.a).sort((x,y)=>x-y);const typ=areas.length?areas[areas.length>>1]:0;
  keep.forEach(o=>{o.n=typ&&keep.length>=3?Math.max(1,Math.round(o.a/typ)):1;});
  if(keep.length>=3)keep.forEach(o=>{if(o.n>1&&o.a<typ*1.7)o.n=1;});
  return {canvas:c,W,H,boxes:keep,count:keep.reduce((t,o)=>t+o.n,0)};
}

/* ---------- Códigos: barras (Code 128) y QR ---------- */
const C128="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
function codeText(p){return String(p.barcode||p.sku||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7e]/g,"");}
function barcodeSVG(text,h){
  const vals=[104];for(const ch of text)vals.push(ch.charCodeAt(0)-32);
  let sum=104;for(let i=1;i<vals.length;i++)sum+=i*vals[i];vals.push(sum%103);vals.push(106);
  let x=10,rects="";
  vals.forEach(v=>{const w=C128[v];for(let i=0;i<w.length;i++){const n=+w[i];if(i%2===0)rects+='<rect x="'+x+'" y="0" width="'+n+'" height="'+h+'"/>';x+=n;}});
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+10)+' '+h+'" preserveAspectRatio="none" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';
}
function qrSVG(text){
  const q=new QRLIB.QRCode(-1,QRLIB.ECL.M);q.addData(unescape(encodeURIComponent(text)));q.make();
  const n=q.getModuleCount(),z=4;let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.modules[r][c])d+="M"+(c+z)+" "+(r+z)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2*z)+' '+(n+2*z)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function svgToPng(svg,w,h){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(i,0,0,w,h);c.toBlob(b=>b?res(b):rej(),"image/png");};i.onerror=rej;i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});}
function labelHTML(p,opt){

    '<div class="lbl-c">'+(opt.barras?'<div class="lbl-b">'+barcodeSVG(t,40)+'<div class="lbl-s">'+esc(t)+'</div></div>':'')+(opt.qr?'<div class="lbl-q">'+qrSVG(t)+'</div>':'')+'</div>'+(opt.barras?'':'<div class="lbl-s">'+esc(t)+'</div>')+'</div>';
}

function uniq(k){const s=new Set();S.products.forEach(p=>{if(p[k])s.add(p[k]);});return Array.from(s).sort();}

/* ---------- Views ---------- */
function filtered(){

}
function itemHTML(p,id,countMode){
  const th=p.foto?'<button class="thumb" data-photo="'+id+'"><img alt="" src="'+p.foto+'" style="width:58px;height:58px;border-radius:9px;object-fit:cover"></button>':'<button class="thumb nofoto" data-photo="'+id+'">📷<br>Foto</button>';
  const right=countMode?'<div class="qty"><button data-m="'+id+'" aria-label="menos">−</button><input data-q="'+id+'" inputmode="numeric" value="'+(p.stock||0)+'"><button data-p="'+id+'" aria-label="más">+</button></div>'
    :'<div style="text-align:right;flex:none"><b>'+intf(p.stock||0)+'</b><div class="mut">'+money(num(p.precio))+'</div></div>';

function idOf(p){for(const [k,v] of S.products)if(v===p)return k;return null;}
function searchBar(){
  const zs=Array.from(S.zones.values()).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return '<div class="row" style="margin-bottom:8px"><select id="zSel" class="grow"><option value="">Todas las zonas</option>'+zs.map(z=>'<option'+(z.nombre===S.zoneFilter?" selected":"")+'>'+esc(z.nombre)+'</option>').join("")+'</select></div>'+
  '<div class="row" style="margin-bottom:10px"><input id="qIn" class="grow" placeholder="Buscar por nombre, SKU o código" value="'+esc(S.q)+'"><button class="btn" id="scanBtn" title="Escanear código">▦</button></div>';
}
function viewContar(){
  const items=filtered();
  const z=S.zoneFilter?Array.from(S.zones.values()).find(x=>x.nombre===S.zoneFilter):null;
  const zId=z?Array.from(S.zones.entries()).find(e=>e[1]===z)[0]:null;
  let h=searchBar();
  if(z){h+='<div class="card row"><div class="grow"><b>'+esc(z.nombre)+'</b> <span class="pill '+pillCls(z.estado)+'">'+esc(z.estado||"pendiente")+'</span><div class="mut">'+(z.responsable?("Responsable: "+esc(z.responsable)+" · "):"")+items.length+' modelos · '+intf(items.reduce((a,p)=>a+num(p.stock),0))+' unidades</div></div>'+
    (z.estado==="contada"?'<button class="btn sm" data-zre="'+zId+'">Reabrir</button>':'<button class="btn sm pri" data-zok="'+zId+'">Marcar contada</button>')+'</div>';}
  if(!S.products.size)return h+'<div class="empty">Todavía no hay productos.<br>Toca <b>+ Producto</b> para registrar el primero con su foto.</div>';
  if(!items.length)return h+'<div class="empty">Sin resultados.'+(S.q?'<br><button class="btn sm" id="newFromQ" style="margin-top:8px">+ Crear producto nuevo</button>':"")+'</div>';

function totals(arr){return arr.reduce((a,p)=>{a.u+=num(p.stock);a.c+=num(p.stock)*num(p.costo);a.v+=num(p.stock)*num(p.precio);if(!p.foto)a.sf++;return a;},{u:0,c:0,v:0,sf:0});}
function viewProductos(){
  const all=list();const t=totals(all);
  let h='<div class="kpis"><div class="kpi"><b>'+intf(all.length)+'</b><span>Modelos (SKU)</span></div><div class="kpi"><b>'+intf(t.u)+'</b><span>Unidades</span></div><div class="kpi"><b>'+money(t.c)+'</b><span>Valor a costo</span></div><div class="kpi"><b>'+money(t.v)+'</b><span>Valor a precio de venta</span></div></div>';
  if(t.sf&&all.length)h+='<div class="warnbox">📷 '+t.sf+' producto(s) sin foto de referencia. Toca el recuadro de la foto para tomarla.</div>';

  h+='<div class="chips"><button class="chip'+(S.catFilter?"":" on")+'" data-cat="">Todas</button>'+cats.map(c=>'<button class="chip'+(S.catFilter===c?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+' ('+all.filter(p=>p.cat===c).length+')</button>').join("")+'</div>';
  if(all.length){const st=aiStats();const nA=Object.values(st).reduce((a,b)=>a+b,0);const conF=all.filter(p=>p.foto).length;
    h+='<div class="card"><button class="btn full" id="lblBtn">🏷 Etiquetas con código de barras y QR</button>'+
      '<div class="mut" style="margin-top:8px">🧠 Reconocimiento de tipo: '+nA+' de '+conF+' fotos aprendidas'+(nA?' ('+Object.entries(st).map(([k,v])=>esc(k)+' '+v).join(", ")+')':'')+'.</div>'+
      (conF>nA?'<button class="btn sm" id="aiBtn" style="margin-top:6px">Aprender de las fotos</button>':'')+'</div>';}

  if(!all.length)return h+'<div class="empty">Sin productos aún. Regístralos con <b>+ Producto</b> o impórtalos desde Excel.</div>';

function pillCls(e){return e==="contada"?"p-ok":e==="en conteo"?"p-cur":"p-pend";}
function viewZonas(){
  const zs=Array.from(S.zones.entries()).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre));
  const done=zs.filter(z=>z[1].estado==="contada").length;
  let h='<div class="card"><h3>Avance del inventario</h3><div class="mut">'+done+' de '+zs.length+' zonas contadas</div><div class="bar"><i style="width:'+(zs.length?Math.round(done/zs.length*100):0)+'%"></i></div></div>';
  h+='<div class="card"><h3>Nueva zona</h3><div class="mut" style="margin-bottom:4px">Ej. Vitrina 1, Cajón collares, Caja almacén 3</div><div class="row"><input id="zName" class="grow" placeholder="Nombre de la zona"><input id="zResp" class="grow" placeholder="Responsable"></div><button class="btn pri full" id="zAdd" style="margin-top:8px">Agregar zona</button></div>';
  if(!zs.length)return h+'<div class="empty">Crea las zonas (vitrinas, cajones, cajas) para repartir el conteo.</div>';
  zs.forEach(([id,z])=>{const ps=list().filter(p=>p.zona===z.nombre);const u=ps.reduce((a,p)=>a+num(p.stock),0);
    h+='<div class="item"><div class="grow"><div class="name">'+esc(z.nombre)+'</div><div class="mut">'+(z.responsable?esc(z.responsable)+" · ":"")+ps.length+' modelos · '+intf(u)+' unid.</div></div>'+
    '<button class="btn sm" data-zst="'+id+'"><span class="pill '+pillCls(z.estado)+'">'+esc(z.estado||"pendiente")+'</span></button>'+
    '<button class="btn sm" data-zgo="'+esc(z.nombre)+'">Contar</button><button class="btn sm bad" data-zdel="'+id+'">✕</button></div>';});
  return h;

function issues(){
  const all=list();const by=(f)=>{const m=new Map();all.forEach(p=>{const k=f(p);if(!k)return;m.set(k,(m.get(k)||0)+1);});return Array.from(m.values()).filter(n=>n>1).reduce((a,n)=>a+n,0);};
  return [
   ["Sin precio de venta",all.filter(p=>!num(p.precio)).length],
   ["Sin costo",all.filter(p=>!num(p.costo)).length],
   ["Sin foto de referencia",all.filter(p=>!p.foto).length],
   ["Cantidad en 0",all.filter(p=>!num(p.stock)).length],
   ["Sin zona asignada",all.filter(p=>!p.zona).length],
   ["SKU repetido",by(p=>p.sku)],
   ["Nombre repetido (el sistema podría rechazarlo)",by(p=>norm(pname(p)))],
   ["Código de barras repetido",by(p=>p.barcode)],
   ["Precio menor que el costo",all.filter(p=>num(p.precio)&&num(p.precio)<num(p.costo)).length],
   ["Zonas sin marcar como contadas",Array.from(S.zones.values()).filter(z=>z.estado!=="contada").length]
  ];
}

   '<div class="grid2"><div><label>Afectación IGV</label><select id="optAfe">'+AFECT.map(a=>'<option'+(a===posOpt("afe",AFECT[0])?" selected":"")+'>'+a+'</option>').join("")+'</select></div>'+
   '<div><label>Unidad de medida</label><select id="optUnd">'+UNDS.map(a=>'<option'+(a===posOpt("und",UNDS[0])?" selected":"")+'>'+a+'</option>').join("")+'</select></div></div>'+

  h+='<div class="card"><h3>Combinar celulares</h3><div class="mut">Si cuentan varias personas, cada una envía su respaldo y el celular principal lo combina. Se juntan productos, cantidades, fotos y zonas; si un producto se editó en dos celulares, queda el cambio más reciente.</div><div style="display:grid;gap:8px;margin-top:8px">'+
   '<button class="btn full" id="bShare">📤 Enviar mi respaldo (WhatsApp, Drive…)</button>'+
   '<button class="btn full" id="bSave">⬇ Guardar respaldo en el celular</button>'+
   '<button class="btn pri full" id="bMerge">⬆ Combinar respaldo de otro celular</button></div><div id="bMsg" class="mut" style="margin-top:6px"></div></div>';
  h+='<div class="card"><h3>Importar desde Excel</h3><div class="mut">Carga una lista que ya tengas. Columnas reconocidas: SKU, Código de barras, Categoría, Modelo, Material, Color, Talla, Cantidad/Stock, Costo, Precio, Zona. Si el SKU ya existe se actualiza.</div><div style="display:grid;gap:8px;margin-top:8px"><button class="btn full" id="xTpl">⬇ Plantilla vacía</button><button class="btn full" id="xImp">⬆ Importar archivo</button></div><div id="impMsg" class="mut" style="margin-top:6px"></div></div>';
  
  return h;
}

/* ---------- Render ---------- */
function render(){
  const v={contar:viewContar,productos:viewProductos,zonas:viewZonas,excel:viewExcel}[S.tab];
  $("#main").innerHTML=v();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  $("#fab").classList.toggle("hidden",!(S.tab==="contar"||S.tab==="productos")||!S.canWrite);
  bind();
}
/* re-render without losing typing focus in the search box */
function renderSoft(){
  const a=document.activeElement;
  if(a&&a.id==="qIn"){const pos=a.selectionStart;render();const n=$("#qIn");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  if(a&&a.dataset&&a.dataset.q)return; // user is typing a quantity; skip
  if($("#modalRoot").innerHTML)return render(), void 0;
  render();
}
function bind(){
  const q=$("#qIn");if(q)q.addEventListener("input",()=>{S.q=q.value;renderSoft();});
  const zs=$("#zSel");if(zs)zs.addEventListener("change",()=>{S.zoneFilter=zs.value;render();});
  const sb=$("#scanBtn");if(sb)sb.onclick=()=>scan(v=>{S.q=v;const hit=list().find(p=>p.barcode===v||p.sku===v);render();if(!hit){confirmBox("Código "+v+" no registrado. ¿Crear producto nuevo con este código?","Crear").then(ok=>{if(ok)openForm(null,{barcode:v});});}});
  const nq=$("#newFromQ");if(nq)nq.onclick=()=>openForm(null,{modelo:S.q});
  const m=$("#main");

  m.querySelectorAll("[data-zst]").forEach(el=>el.onclick=()=>{const id=el.dataset.zst;const z=S.zones.get(id);const i=ESTADOS.indexOf(z.estado||"pendiente");writeZone(id,Object.assign({},z,{estado:ESTADOS[(i+1)%3]})).catch(()=>{});render();});

function stamp(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());}
function posRows(){return list().sort((a,b)=>String(a.sku).localeCompare(String(b.sku))).map(p=>({"SKU":p.sku,"Código de barras":p.barcode||p.sku,"Nombre":pname(p),"Categoría":p.cat,"Modelo":p.modelo||"","Material":p.material||"","Color":p.color||"","Talla":p.talla||"","Stock":num(p.stock),"Costo":num(p.costo),"Precio venta":num(p.precio),"Zona":p.zona||"","Tiene foto":p.foto?"Sí":"No","Notas":p.notas||""}));}
function saveFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},3000);toast("Descargado en tu carpeta Descargas: "+filename,3500);return Promise.resolve(true);}
  catch(e){toast("No se pudo descargar el archivo");return Promise.resolve(false);}
}
function exportXlsx(){
  if(!window.XLSX)return toast("El generador de Excel no cargó. Usa CSV o revisa tu conexión.",4000);
  if(!S.products.size)return toast("No hay productos para exportar");
  const X=window.XLSX;const wb=X.utils.book_new();
  const r=posRows();const ws=X.utils.json_to_sheet(r);ws["!cols"]=[14,16,38,12,16,12,12,8,8,9,11,16,9,20].map(w=>({wch:w}));ws["!autofilter"]={ref:ws["!ref"]};
  X.utils.book_append_sheet(wb,ws,"Importar_POS");
  const cm=new Map();list().forEach(p=>{const k=p.cat||"Otro";const o=cm.get(k)||{"Categoría":k,"Modelos":0,"Unidades":0,"Valor costo":0,"Valor venta":0};o.Modelos++;o.Unidades+=num(p.stock);o["Valor costo"]+=num(p.stock)*num(p.costo);o["Valor venta"]+=num(p.stock)*num(p.precio);cm.set(k,o);});
  const cr=Array.from(cm.values());const t=totals(list());cr.push({"Categoría":"TOTAL","Modelos":S.products.size,"Unidades":t.u,"Valor costo":Math.round(t.c*100)/100,"Valor venta":Math.round(t.v*100)/100});
  cr.forEach(o=>{o["Valor costo"]=Math.round(o["Valor costo"]*100)/100;o["Valor venta"]=Math.round(o["Valor venta"]*100)/100;});
  const ws2=X.utils.json_to_sheet(cr);ws2["!cols"]=[{wch:16},{wch:10},{wch:10},{wch:14},{wch:14}];X.utils.book_append_sheet(wb,ws2,"Resumen_categoria");
  const zr=Array.from(S.zones.values()).map(z=>{const ps=list().filter(p=>p.zona===z.nombre);return {"Zona":z.nombre,"Responsable":z.responsable||"","Estado":z.estado||"pendiente","Modelos":ps.length,"Unidades":ps.reduce((a,p)=>a+num(p.stock),0)};});
  const sz=list().filter(p=>!p.zona);if(sz.length)zr.push({"Zona":"(Sin zona)","Responsable":"","Estado":"","Modelos":sz.length,"Unidades":sz.reduce((a,p)=>a+num(p.stock),0)});
  const ws3=X.utils.json_to_sheet(zr.length?zr:[{"Zona":"","Responsable":"","Estado":"","Modelos":0,"Unidades":0}]);ws3["!cols"]=[{wch:22},{wch:18},{wch:12},{wch:10},{wch:10}];X.utils.book_append_sheet(wb,ws3,"Avance_zonas");
  const ws4=X.utils.json_to_sheet(issues().map(([k,n])=>({"Revisión":k,"Cantidad":n})));ws4["!cols"]=[{wch:32},{wch:10}];X.utils.book_append_sheet(wb,ws4,"Observaciones");
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  saveFile("Inventario_Bisuteria_"+stamp()+".xlsx",new Blob([out]));
}
function csvCell(v){const s=String(v==null?"":v);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCsv(){
  if(!S.products.size)return toast("No hay productos para exportar");
  const r=posRows();const cols=Object.keys(r[0]);
  const txt="﻿"+[cols.join(",")].concat(r.map(o=>cols.map(c=>csvCell(o[c])).join(","))).join("\r\n");
  saveFile("Inventario_POS_"+stamp()+".csv",txt);
}
function exportTemplate(){
  const cols=["SKU","Código de barras","Categoría","Modelo","Material","Color","Talla","Cantidad","Costo","Precio venta","Zona"];
  if(window.XLSX){const X=window.XLSX;const wb=X.utils.book_new();const ws=X.utils.aoa_to_sheet([cols,["","","Collar","Corazón","Acero","Dorado","45 cm",10,8.5,25,"Vitrina 1"]]);ws["!cols"]=cols.map(()=>({wch:15}));X.utils.book_append_sheet(wb,ws,"Productos");saveFile("Plantilla_Inventario.xlsx",new Blob([X.write(wb,{bookType:"xlsx",type:"array"})]));}
  else saveFile("Plantilla_Inventario.csv","﻿"+cols.join(","));
}
/* ZIP (sin compresión) con las fotos nombradas por SKU */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.name);const crc=crc32(f.data);const sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);off+=30+name.length+sz;});
  const cs=central.reduce((a,x)=>a+x.length,0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(central,[new Uint8Array(e.buffer)]),{type:"application/zip"});
}
function dataUrlBytes(u){const b=atob(u.split(",")[1]||"");const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function exportZip(){
  const ps=list().filter(p=>p.foto);if(!ps.length)return toast("Aún no hay fotos");
  const used=new Set();
  const files=ps.map(p=>{let n=String(p.sku||"SIN-SKU").replace(/[^A-Za-z0-9._-]/g,"_");let k=n,i=2;while(used.has(k))k=n+"_"+(i++);used.add(k);return {name:k+".jpg",data:dataUrlBytes(p.foto)};});
  saveFile("Fotos_SKU_"+stamp()+".zip",makeZip(files));
}

const AFECT=["Gravado - Operación Onerosa","Gravado - Bonificaciones","Exonerado - Operación Onerosa","Exonerado - Transferencia gratuita","Inafecto - Operación Onerosa"];
const UNDS=["PRODUCTO (UND)","PIEZA","PAR","JUEGO","KIT","DOCENA","PAQUETE","CAJA","BOLSA"];
function posOpt(k,d){try{return localStorage.getItem("inv_pos_"+k)||d;}catch(e){return d;}}
function posSet(k,v){try{localStorage.setItem("inv_pos_"+k,v);}catch(e){}}
async function inflateRaw(u8){const ds=new DecompressionStream("deflate-raw");const out=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(out);}
async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("zip");
  const n=dv.getUint16(e+10,true);let o=dv.getUint32(e+16,true);const files=[];const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    const method=dv.getUint16(o+10,true),csz=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),xl=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
    const name=dec.decode(u8.subarray(o+46,o+46+nl));
    const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);const raw=u8.subarray(lo+30+lnl+lxl,lo+30+lnl+lxl+csz);
    files.push({name,data:method===8?await inflateRaw(raw):raw.slice()});
    o+=46+nl+xl+cl;
  }
  return files;
}
function xesc(v){return String(v==null?"":v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const POS_COLS="ABCDEFGHIJKLMNOPQR".split("");
const POS_STY={A:3,B:3,C:3,D:3,E:1,F:3,G:3,H:1,I:1,J:1,K:1,L:1,M:1,N:1,O:3,P:1,Q:1,R:1};
function posRow(p,afe,und){
  const desc=[p.material,p.color,p.talla?("Talla "+p.talla):""].filter(Boolean).join(" / ")+(p.notas?(" - "+p.notas):"");
  return {A:p.barcode||p.sku,B:p.sku,C:und,D:pname(p),G:desc,H:num(p.costo),I:afe,J:"SI",K:"SI",L:"SI",M:"Libre",P:Math.max(0,Math.round(num(p.stock))),Q:num(p.precio),R:"SI"};
}
async function exportPos(){
  if(!S.products.size)return toast("No hay productos para exportar");
  if(!("DecompressionStream" in window))return toast("Este navegador no puede generar la plantilla. Actualiza Chrome.",4000);
  const sinPrecio=list().filter(p=>!num(p.precio)).length;
  if(sinPrecio&&!(await confirmBox(sinPrecio+" producto(s) no tienen precio de venta y se subirán con precio 0. ¿Generar de todos modos?","Generar")))return;
  try{
    const afe=$("#optAfe")?$("#optAfe").value:AFECT[0],und=$("#optUnd")?$("#optUnd").value:UNDS[0];
    const bin=atob(POS_TPL);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const files=await unzip(u8);const f=files.find(x=>x.name==="xl/worksheets/sheet1.xml");
    let xml=new TextDecoder().decode(f.data);
    const items=list().sort((a,b)=>String(a.sku).localeCompare(String(b.sku)));
    const last=Math.max(202,items.length+2);
    let rows="";
    for(let r=3;r<=last;r++){
      const d=items[r-3]?posRow(items[r-3],afe,und):null;
      rows+='<row r="'+r+'" spans="1:18">';
      POS_COLS.forEach(c=>{const v=d?d[c]:undefined;const ref=c+r,st=' s="'+POS_STY[c]+'"';
        if(v===undefined||v==="")rows+='<c r="'+ref+'"'+st+'/>';
        else if(typeof v==="number")rows+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
        else rows+='<c r="'+ref+'"'+st+' t="inlineStr"><is><t>'+xesc(v)+'</t></is></c>';});
      rows+='</row>';
    }
    const a=xml.indexOf('<row r="3"'),b=xml.indexOf('</sheetData>');
    if(a<0||b<0)throw new Error("tpl");
    xml=xml.slice(0,a)+rows+xml.slice(b);
    xml=xml.replace('<dimension ref="A1:R202"','<dimension ref="A1:R'+last+'"').replace(/([A-R])3:\1202\b/g,(m,c)=>c+"3:"+c+last);
    f.data=new TextEncoder().encode(xml);
    const blob=makeZip(files);
    await saveFile("Carga_Masiva_Productos_"+stamp()+".xlsx",blob);
  }catch(e){toast("No se pudo generar la plantilla del punto de venta",3500);}
}

/* ---------- Respaldo y combinación entre celulares ---------- */
function backupName(){return "Respaldo_Inventario_"+stamp()+".json";}
function backupBlob(){return new Blob([JSON.stringify({app:"inventario-bisuteria",version:1,exportado:new Date().toISOString(),productos:Object.fromEntries(S.products),zonas:Object.fromEntries(S.zones)})],{type:"application/json"});}
async function shareBackup(){
  if(!S.products.size)return toast("No hay productos para enviar");
  const f=new File([backupBlob()],backupName(),{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Respaldo inventario"});}catch(e){if(e&&e.name!=="AbortError")toast("No se pudo compartir; usa Guardar respaldo");}}
  else saveFile(f.name,f);
}
$("#backupInput").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  let o;try{o=JSON.parse(await f.text());}catch(err){return toast("El archivo no es un respaldo válido");}
  if(!o||o.app!=="inventario-bisuteria")return toast("El archivo no es un respaldo de esta app");
  const inc=Object.entries(o.productos||{});
  if(!(await confirmBox("Combinar "+inc.length+" productos de "+f.name+" con este celular?","Combinar")))return;
  let nNew=0,nUpd=0,nSame=0;const renum=[];
  // zones by name
  for(const z of Object.values(o.zonas||{})){if(z&&z.nombre&&!Array.from(S.zones.values()).some(x=>norm(x.nombre)===norm(z.nombre)))await writeZone(uid(),{nombre:z.nombre,responsable:z.responsable||"",estado:z.estado||"pendiente"}).catch(()=>{});}
  for(const [id,p] of inc){
    if(!p||typeof p!=="object")continue;
    const cur=S.products.get(id);
    if(cur){ if(String(p.actualizado||"")>String(cur.actualizado||"")){await writeProduct(id,Object.assign({},p,{foto:p.foto||cur.foto||""})).catch(()=>{});nUpd++;}else nSame++; continue; }
    const q=Object.assign({},p);
    const clash=list().find(x=>x.sku===q.sku);
    if(clash){const old=q.sku;q.sku=genSku(q);renum.push(old+" → "+q.sku);}
    await writeProduct(id,q).catch(()=>{});nNew++;
  }
  render();
  const m="Combinado: "+nNew+" nuevos, "+nUpd+" actualizados, "+nSame+" sin cambios."+(renum.length?" SKU renumerados por repetirse: "+renum.join(", ")+". Corrige sus etiquetas si ya las imprimiste.":"");
  const el=$("#bMsg");if(el)el.textContent=m;toast(m.slice(0,120),5000);
});
/* ---------- Import ---------- */
const MAP=[["barcode",["barra","ean","upc"]],["sku",["sku","codigo","cod"]],["cat",["categ","tipo","familia"]],["modelo",["modelo","nombre","descrip","producto"]],["material",["material"]],["color",["color"]],["talla",["talla","medida","tamano"]],["stock",["stock","cantidad","unidades","cant","existencia"]],["costo",["costo","compra"]],["precio",["precio","venta","pvp"]],["zona",["zona","ubicacion","exhibidor","almacen"]],["notas",["nota","observ"]]];
function mapHeader(h){const n=norm(h);for(const [k,keys] of MAP)if(keys.some(x=>n.includes(x)))return k;return null;}
$("#importInput").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const msg=$("#impMsg");
  try{
    const wb=window.XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length){toast("El archivo está vacío");return;}
    const hmap={};Object.keys(rows[0]).forEach(h=>{const k=mapHeader(h);if(k&&!Object.values(hmap).includes(k))hmap[h]=k;});
    if(!Object.values(hmap).some(k=>k==="modelo"||k==="sku")){toast("No encontré columnas de Modelo o SKU",4000);return;}
    const ok=await confirmBox("Se importarán "+rows.length+" filas desde "+f.name+". ¿Continuar?","Importar");if(!ok)return;
    let nNew=0,nUpd=0;const now=new Date().toISOString();
    for(let i=0;i<rows.length;i++){
      const r=rows[i];const o={};for(const h in hmap)o[hmap[h]]=String(r[h]).trim();
      if(!o.modelo&&!o.sku)continue;
      const cat=o.cat?(CATS.find(c=>norm(c.n)===norm(o.cat)||norm(o.cat).startsWith(norm(c.n).slice(0,4)))||{n:o.cat}).n:"Otro";
      const d={cat,modelo:o.modelo||"",material:o.material||"",color:o.color||"",talla:o.talla||"",barcode:o.barcode||"",stock:Math.max(0,Math.round(num(o.stock))),costo:num(o.costo),precio:num(o.precio),zona:o.zona||"",notas:o.notas||""};
      if(d.zona&&!Array.from(S.zones.values()).some(z=>z.nombre===d.zona))await writeZone(uid(),{nombre:d.zona,responsable:"",estado:"pendiente"}).catch(()=>{});
      const skuU=(o.sku||"").toUpperCase();
      const hit=skuU?Array.from(S.products.entries()).find(([k,p])=>p.sku===skuU):null;
      if(hit){await writeProduct(hit[0],Object.assign({},hit[1],d,{actualizado:now})).catch(()=>{});nUpd++;}
      else{const sku=skuU||genSku(d);await writeProduct(uid(),Object.assign(d,{sku,foto:"",contado:false,creado:now,actualizado:now})).catch(()=>{});nNew++;}
      if(msg)msg.textContent="Importando… "+(i+1)+" / "+rows.length;
    }
    render();toast("Importación lista: "+nNew+" nuevos, "+nUpd+" actualizados",4000);
  }catch(err){toast("No se pudo leer el archivo",3500);}
});

render();
initStore();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
